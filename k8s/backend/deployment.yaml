apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-clientes-mklens
  labels:
    app: backend-clientes-mklens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-clientes-mklens
  template:
    metadata:
      labels:
        app: backend-clientes-mklens
    spec:
      imagePullSecrets:
        - name: dockerhubregcred
      containers:
        - name: backend
          image: afloresmansilla/backend-clientes-mklens:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3080
          envFrom:
            - configMapRef:
                name: backend-clientes-mklens
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: password
            - name: LENS_MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: host
            - name: LENS_MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: port
            - name: LENS_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: username
            - name: LENS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: password
            - name: EXTRACT_MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-abdv2
                  key: host
            - name: EXTRACT_MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-abdv2
                  key: port
            - name: EXTRACT_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: username
            - name: EXTRACT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: password
            - name: API_MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: host
            - name: API_MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: port
            - name: API_MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: username
            - name: API_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-api
                  key: password

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
